networks:
  minibank:

volumes:
  cache:
    driver: local
  redisinsight:
    driver: local
  metrics:

services:
  prometheus:
    image: prom/prometheus:v2.40.4
    ports:
      - 9090:9090
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - minibank

  grafana:
    image: grafana/grafana:9.3.0
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=devops123
    volumes:
      - ./metrics/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./metrics/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./metrics/dashboards:/var/lib/grafana/dashboards
      - metrics:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - minibank

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    hostname: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - minibank

  rabbitmq:
    image: rabbitmq:3.8-management
    hostname: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - minibank

  redis:
    image: redis:alpine
    hostname: redis
    ports:
      - 6379:6379
    volumes:
      - cache:/data
    networks:
      - minibank

  postgres:
    image: postgres:latest
    hostname: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./configs/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: postgres -c checkpoint_timeout=600 -c max_wal_size=4096
    networks:
      - minibank
