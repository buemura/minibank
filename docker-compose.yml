networks:
  minibank:

volumes:
  cache:
    driver: local
  redisinsight:
    driver: local
  metrics:

services:
  prometheus:
    image: prom/prometheus:v2.40.4
    ports:
      - 9090:9090
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - minibank

  grafana:
    image: grafana/grafana:9.3.0
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=devops123
    volumes:
      - ./metrics/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./metrics/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./metrics/dashboards:/var/lib/grafana/dashboards
      - metrics:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - minibank

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    hostname: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - minibank

  rabbitmq:
    image: rabbitmq:3.8-management
    hostname: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - minibank

  redis:
    image: redis:alpine
    hostname: redis
    ports:
      - 6379:6379
    volumes:
      - cache:/data
    networks:
      - minibank

  postgres:
    image: postgres:latest
    hostname: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./configs/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: postgres -c checkpoint_timeout=600 -c max_wal_size=4096
    networks:
      - minibank

  svc-auth:
    build:
      context: .
      dockerfile: apps/svc-auth/Dockerfile
    hostname: svc-auth
    ports:
      - "50051:50051"
    environment:
      - GRPC_PORT=50051
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=svc_auth
      - JWT_SECRET=your-secret-key-change-in-production
      - ACCESS_TOKEN_EXPIRY=15
      - REFRESH_TOKEN_EXPIRY=10080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - postgres
    networks:
      - minibank

  svc-account:
    build:
      context: .
      dockerfile: apps/svc-account/Dockerfile
    hostname: svc-account
    ports:
      - "50052:50052"
    environment:
      - GRPC_PORT=50052
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=svc_account
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - postgres
    networks:
      - minibank

  svc-transaction:
    build:
      context: .
      dockerfile: apps/svc-transaction/Dockerfile
    hostname: svc-transaction
    ports:
      - "50053:50053"
    environment:
      - GRPC_PORT=50053
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=svc_transaction
      - ACCOUNT_SERVICE_ADDR=svc-account:50052
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - postgres
      - svc-account
    networks:
      - minibank

  api-gtw:
    build:
      context: .
      dockerfile: apps/api-gtw/Dockerfile
    hostname: api-gtw
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - AUTH_SERVICE_ADDR=svc-auth:50051
      - ACCOUNT_SERVICE_ADDR=svc-account:50052
      - TRANSACTION_SERVICE_ADDR=svc-transaction:50053
      - REDIS_ADDR=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - redis
      - svc-auth
      - svc-account
      - svc-transaction
    networks:
      - minibank
