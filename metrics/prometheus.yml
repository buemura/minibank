---
global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:

rule_files:

scrape_configs:
  - job_name: api-gtw
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: svc-auth
    static_configs:
      - targets: ["host.docker.internal:9091"]
  - job_name: svc-account
    static_configs:
      - targets: ["host.docker.internal:9092"]
  - job_name: svc-transaction
    static_configs:
      - targets: ["host.docker.internal:9093"]
